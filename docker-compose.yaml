version: "3.9"

services:
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_tcc
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - postgres

  publisher-mqtt:
    image: gcc:latest
    container_name: publisher_mqtt_c
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      - mosquitto
    environment:
      - BIODATA_HOST=mosquitto
    # Instala a biblioteca necessária antes de rodar o executável
    command: /bin/bash -c "apt-get update && apt-get install -y libmosquitto1 && ./pub_mqtt"

  publisher-modbus:
    image: gcc:latest
    container_name: publisher_modbus_c
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      - subscriber
    environment:
      - BIODATA_HOST=subscriber
    # Instala a biblioteca necessária antes de rodar o executável
    command: /bin/bash -c "apt-get update && apt-get install -y libmodbus5 && ./pub_modbus"

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: monitoramento
      POSTGRES_USER: subscriber
      POSTGRES_PASSWORD: subscriber
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres_monitoramento.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subscriber -d monitoramento"]
      interval: 5s
      timeout: 5s
      retries: 5

  subscriber:
    build: subscriber
    container_name: subscriber
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "1502:1502"
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_KEEPALIVE: 10
      MQTT_USE_TLS: 0
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: monitoramento
      POSTGRES_USER: subscriber
      POSTGRES_PASSWORD: subscriber
      PGSSLMODE: disable
      PGPASSWORD: subscriber 
    
volumes:
  postgres-data: